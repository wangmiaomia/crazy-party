argin-top:18px}.action{min-height:50px;border:0;border-radius:999px;padding:0 22px;font-weight:900;cursor:pointer}.primary{background:#e5bd5b;color:#161208}.secondary{background:#1d3c32;color:#fff}.result{display:none;margin-top:16px;padding:17px;border-radius:16px;background:#0d1815;border:1px solid rgba(255,255,255,.1)}.result.show{display:block}.url{word-break:break-all;font:12px/1.7 ui-monospace,monospace;color:#e8cf8a}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.quick a{text-align:center;padding:11px 6px;border-radius:10px;background:#17251f;color:#dce9e3;text-decoration:none;font-size:11px}.tip{color:#71857d;font-size:10px;line-height:1.7;margin-top:10px}.wide{grid-column:1/-1}@media(max-width:800px){.grid,.musicGrid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.wide{grid-column:auto}}
</style></head><body><main><div class="eyebrow">FINAL INVITATION LINK GENERATOR · V53</div><h1>邀请链接生成器</h1><p class="lead">选主题、填邀请信息、指定今晚 BGM，也可以直接修改首页/内页标题和派对要求。部署到 GitHub Pages 后，本页会自动识别当前新仓库地址。</p>
<div class="panel"><div class="sec"><b>01 邀请信息</b></div><div class="grid"><div class="field"><label>主题</label><select id="theme"></select></div><div class="field"><label>受邀人</label><input id="to" value="李思琪"></div><div class="field"><label>日期</label><input id="date" value="08/29"></div><div class="field"><label>星期</label><input id="day" value="周六"></div><div class="field"><label>时间</label><input id="time" value="19:30"></div><div class="field"><label>地点</label><input id="venue" value="王苗苗之家"></div><div class="field wide"><label>GitHub Pages 根地址（部署后会自动识别；也可手填）</label><input id="baseUrl"></div></div></div>
<div class="panel"><div class="sec"><b>02 可编辑文案</b></div><div class="grid"><div class="field wide"><label>首页大标题（用 | 分行）</label><input id="front"></div><div class="field wide"><label>首页引导文案</label><input id="frontdesc"></div><div class="field wide"><label>内页大标题（用 | 分行）</label><input id="inside"></div><div class="field wide"><label>内页引导文案</label><input id="insidelead"></div><div class="field wide"><label>内页派对要求（每行一条）</label><textarea id="dress"></textarea></div></div><div class="tip">这里改的是链接参数，不会改仓库里的原始 HTML；因此每个朋友都可以生成不同文案。</div></div>
<div class="panel"><div class="sec"><b>03 选择今晚 BGM</b></div><div class="musicGrid" id="musicGrid"></div><div class="tip">试听使用仓库 assets/audio 内的完整 MP3；正式邀请页只显示你选中的一首，不会显示五首选择器。</div></div>
<div class="panel"><div class="sec"><b>04 生成链接</b></div><div class="actions"><button class="action primary" id="make">生成专属邀请链接</button><button class="action secondary" id="copy">复制链接</button><button class="action secondary" id="open">打开测试</button></div><div id="result" class="result"><div id="url" class="url"></div><div class="quick" id="quick"></div></div></div>
<script>
const THEMES={
'01':{name:'红毯首映礼',front:'今晚请停止做普通人|你将以明星身份入场',frontdesc:'开启明星邀请 → 完成妆造确认 → 真人签名 → 红毯席位正式生效',inside:'你的红毯席位|已经正式保留',lead:'今晚不是普通聚会，是限定首映礼；请带着两米八气场准时出现。',dress:['今晚是王苗苗之家红毯夜🌟','请各位女明星男明星盛装出席。','妆要浓，衣服要夸张，气场要两米八。','不化妆的，保安（我）有权拒绝入场。']},
'02':{name:'澳门娱乐黑卡',front:'刮开今晚的快乐筹码|激活你的专属通行证',frontdesc:'真彩票刮层 → 全部揭晓 → 签名领取特等奖 → 正式邀约',inside:'你的快乐通行证|已正式生效|今晚所有快乐权限|全部恢复',lead:'成年人偶尔也需要被允许不靠谱一次，今晚只负责开心。',dress:['给我化！化最贵的妆，穿最唬人的衣服。','今晚咱就是人均身家过亿，演也要演像。','班味扔门外，多巴胺穿身上。','周六晚，王苗苗之家，人类高质量聚会。']},
'03':{name:'快乐街机',front:'今晚投币|开始一局快乐',frontdesc:'拖入快乐金币 → 可动摇杆完成方向 Combo → A/B/C 三键连击 → 生成 PLAYER 01 通行卡 → 签名保存存档',inside:'PLAYER 01 快乐模式已加载|今晚正式进入街机副本',lead:'这不是普通聚会，是成年人限定街机夜；今晚可以乱按按钮、乱唱跑调、乱笑很大声，唯一不能继续加班。',dress:['今晚不是来刷工卡，是来解锁隐藏角色。','妆发和衣服请直接开到“限定皮肤”级别。','班味留在投币口，多巴胺请拉满。','8.29 晚，王苗苗之家，PLAYER 01 准时上线。']},
'04':{name:'成年人夜航',front:'你的快乐航班|已经开始登机',frontdesc:'托运工作包袱 → 扫描登机牌 → 真人签名 → 飞往快乐自治区',inside:'前往快乐自治区的航班|现已开放登机',lead:'请暂时离开现实航线，工作消息将在目的地自动失去信号。',dress:['给我化！化最贵的妆，穿最唬人的衣服。','今晚登机的不是打工人，是头等舱名媛和少爷。','班味留在安检口，多巴胺请随身携带。','周六晚，王苗苗之家，准时登机。']},
'05':{name:'专属治疗方案',front:'先完成班味检测|再领取专属治疗方案',frontdesc:'班味诊断 → 私人治疗处方 → 撕票 → 知情签字 → 入场',inside:'班味清除成功|今晚正式入场',lead:'医嘱：今晚禁止懂事，禁止顺便聊工作。',dress:['今晚请按医嘱盛装出席。','妆要浓，衣服要有存在感。','班味留在门外，快乐按疗程加量。','复诊时间：明天再说。']},
'06':{name:'快乐唱片',front:'今晚这张唱片|只播放快乐',frontdesc:'拖动唱针 → 点亮曲目 → 签名确认发行 → 打开唱片内页',inside:'你的快乐唱片|今晚限定发行',lead:'这张唱片没有工作曲目，只有吃喝聊天发疯和明天再说。',dress:['尊嘟假嘟？还有人想素颜来？拱出去！','今晚全员妆造拉满，衣服往死里漂亮。','做不了真名媛，就做一晚限定唱片封面人物。','周六晚，王苗苗之家，我看谁不化。']},
'07':{name:'深夜便利店',front:'今晚所有快乐商品|免费供应',frontdesc:'滑开便利店门 → 店内选购 → 扫码结账 → 签名买单',inside:'HAPPY MART 深夜营业|今晚只卖快乐',lead:'这家便利店只卖让你忘记明天上班的东西，今晚快乐额度无限。',dress:['班味太重？请用化妆品腌入味。','眼线飞到太阳穴，腮红打到后脑勺。','允许你服美役一晚，而且必须服到位。','8.29，王苗苗之家，不美不许进门。']},
'08':{name:'午夜派对酒店',front:'您的快乐套房|已经准备完毕',frontdesc:'刷房卡 → 领钥匙 → 签名入住 → 推门 → 电影式全屏转场',inside:'HAPPY HOTEL 0829|欢迎入住 PARTY SUITE',lead:'今晚你不是来做客，是来办理快乐入住；工作事务统一寄存在前台。',dress:['给我化！化最贵的妆，穿最唬人的衣服。','今晚咱就是人均身家过亿，演也要演像。','Lobby见面必须体面，进房后允许失控。','周六晚，HAPPY HOTEL 0829 等你入住。']}}
const MUSIC=[['youdontcare',"you don't care",'ohsobrkn','assets/audio/you-dont-care.mp3'],['banjia','搬家','张震岳','assets/audio/banjia.mp3'],['henizaiyiqi','和你在一起','李志','assets/audio/henizaiyiqi.mp3'],['whistle','Whistle','试听版','assets/audio/whistle.mp3'],['yecao','野草','椿乐队','assets/audio/yecao.mp3']];
const $=id=>document.getElementById(id);let music='youdontcare',generated='',audio=null;
$('theme').innerHTML=Object.entries(THEMES).map(([k,v])=>`<option value="${k}">${k} ${v.name}</option>`).join('');
function siteBase(){const p=location.pathname.replace(/[^/]*$/,'');return location.origin+p}
$('baseUrl').value=location.protocol.startsWith('http')?siteBase():'https://<你的GitHub用户名>.github.io/<你的新仓库名>/'
function loadCopy(){const d=THEMES[$('theme').value];$('front').value=d.front;$('frontdesc').value=d.frontdesc;$('inside').value=d.inside;$('insidelead').value=d.lead;$('dress').value=d.dress.join('\n')}
$('theme').onchange=loadCopy;loadCopy();
$('musicGrid').innerHTML=MUSIC.map((m,i)=>`<div class="music ${i===0?'on':''}" data-key="${m[0]}"><b>${m[1]}</b><small>${m[2]}</small><button type="button">▶ 试听</button></div>`).join('');
document.querySelectorAll('.music').forEach(card=>{card.onclick=e=>{if(e.target.tagName==='BUTTON')return;music=card.dataset.key;document.querySelectorAll('.music').forEach(x=>x.classList.toggle('on',x===card))};card.querySelector('button').onclick=async e=>{e.stopPropagation();music=card.dataset.key;document.querySelectorAll('.music').forEach(x=>x.classList.toggle('on',x===card));const m=MUSIC.find(x=>x[0]===music);if(audio)audio.pause();audio=new Audio(m[3]);audio.volume=.8;try{await audio.play();e.target.textContent='⏸ 播放中'}catch(err){alert('浏览器阻止播放，请再点一次；GitHub Pages 正式地址通常可正常播放。')}}});
function normBase(){let b=$('baseUrl').value.trim();if(!/\/$/.test(b))b+='/';return b}
function makeURL(theme){const u=new URL(theme+'.html',normBase());const vals={to:$('to').value,date:$('date').value,day:$('day').value,time:$('time').value,venue:$('venue').value,music,share:'1',front:$('front').value,frontdesc:$('frontdesc').value,inside:$('inside').value,insidelead:$('insidelead').value,dress:$('dress').value};Object.entries(vals).forEach(([k,v])=>{if(String(v).trim())u.searchParams.set(k,String(v).trim())});return u.href}
function render(){generated=makeURL($('theme').value);$('url').textContent=generated;$('result').classList.add('show');$('quick').innerHTML=Object.keys(THEMES).map(k=>`<a href="${makeURL(k)}" target="_blank">${k} 上线测试</a>`).join('')}
$('make').onclick=render;$('open').onclick=()=>{if(!generated)render();window.open(generated,'_blank')};
$('copy').onclick=async()=>{if(!generated)render();let ok=false;try{await navigator.clipboard.writeText(generated);ok=true}catch(e){}if(!ok){const t=document.createElement('textarea');t.value=generated;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}$('copy').textContent=ok?'已复制 ✓':'请手动复制';setTimeout(()=>$('copy').textContent='复制链接',1500)};
</script></main></body></html>
